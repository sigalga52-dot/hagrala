<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נאון-רפאל למורה</title>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00d2ff;
            --neon-purple: #9d00ff;
            --bg-dark: #0f0f1b;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            text-align: center;
        }

        .title-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            width: 100%;
            margin-bottom: 30px;
            outline: none;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: right;
        }

        label {
            display: block;
            color: var(--neon-blue);
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--neon-purple);
            border-radius: 10px;
            color: #fff;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .draw-btn {
            background: transparent;
            border: 3px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            text-shadow: 0 0 10px var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
        }

        .draw-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .result-display {
            margin-top: 30px;
            min-height: 100px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result-text {
            font-size: 1.8rem;
            color: #fff;
            margin: 5px 0;
        }

        .highlight {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            font-weight: bold;
        }

        .status {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #aaa;
        }

        .controls {
            margin-top: 10px;
        }

        .reset-link {
            color: #666;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.8rem;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .animating {
            animation: pulse 0.2s infinite;
        }
    </style>
</head>
<body>

<div class="container">
    <input type="text" class="title-input" value="הגרלת כיתה - בואו נתחיל!">

    <div class="inputs-grid">
        <div class="input-group">
            <label>שמות התלמידים (אחד בשורה):</label>
            <textarea id="namesInput" placeholder="ישראל ישראלי&#10;שרה כהן..."></textarea>
        </div>
        <div class="input-group">
            <label>שאלות / משימות (אחת בשורה):</label>
            <textarea id="tasksInput" placeholder="מה התוצאה של...&#10;תאר את התהליך של..."></textarea>
        </div>
    </div>

    <button class="draw-btn" onclick="draw()">הגרלה!</button>

    <div class="result-display" id="resultDisplay">
        <div class="result-text" id="resultContent">התוצאה תופיע כאן</div>
    </div>

    <div class="status" id="statusTracker">הזינו נתונים ולחצו על הכפתור</div>
    <div class="controls">
        <span class="reset-link" onclick="resetPools()">אפס הכל והתחל מחדש</span>
    </div>
</div>

<script>
    let remainingNames = [];
    let remainingTasks = [];

    function draw() {
        const namesText = document.getElementById('namesInput').value.trim();
        const tasksText = document.getElementById('tasksInput').value.trim();

        if (!namesText || !tasksText) {
            alert("אנא הכניסי גם שמות וגם שאלות.");
            return;
        }

        // Initialize pools if empty
        if (remainingNames.length === 0) {
            remainingNames = namesText.split('\n').filter(n => n.trim() !== '');
        }
        if (remainingTasks.length === 0) {
            remainingTasks = tasksText.split('\n').filter(t => t.trim() !== '');
        }

        const btn = document.querySelector('.draw-btn');
        const display = document.getElementById('resultContent');
        
        // Animation effect
        btn.classList.add('animating');
        display.innerText = "מגריל...";

        setTimeout(() => {
            btn.classList.remove('animating');

            // Pick random indices
            const nameIdx = Math.floor(Math.random() * remainingNames.length);
            const taskIdx = Math.floor(Math.random() * remainingTasks.length);

            const chosenName = remainingNames.splice(nameIdx, 1)[0];
            const chosenTask = remainingTasks.splice(taskIdx, 1)[0];

            display.innerHTML = `<span class="highlight">${chosenName}</span><br>יענה על:<br><span class="highlight">${chosenTask}</span>`;

            updateStatus();
        }, 800);
    }

    function updateStatus() {
        const totalNames = document.getElementById('namesInput').value.trim().split('\n').filter(n => n.trim() !== '').length;
        const status = document.getElementById('statusTracker');
        
        if (remainingNames.length === 0) {
            status.innerText = "סבב הסתיים! כולם השתתפו. בקליק הבא יתחיל סבב חדש.";
        } else {
            status.innerText = `נותרו עוד ${remainingNames.length} תלמידים לסבב הנוכחי.`;
        }
    }

    function resetPools() {
        remainingNames = [];
        remainingTasks = [];
        document.getElementById('resultContent').innerText = "הנתונים אופסו. מוכנים להגרלה חדשה!";
        document.getElementById('statusTracker').innerText = "הסבב התאפס.";
    }
</script>

</body>
</html>
